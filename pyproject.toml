[project]
name = "analytics-engine"
version = "1.0.0"
description = "Motor analítico end-to-end: datos tipo Google Sheets -> Polars -> PostgreSQL (Star Schema) -> Power BI / Looker Studio"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "polars>=1.30",
    "psycopg2-binary>=2.9",
    "SQLAlchemy>=2.0",
    "numpy>=1.26",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools]
packages = ["analytics_engine"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "db: tests de integración que necesitan una instancia de PostgreSQL accesible",
]
addopts = "-ra"
